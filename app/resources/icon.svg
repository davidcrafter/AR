<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6e6f0"/>
    </linearGradient>
  </defs>
  <!-- Rounded background (Apple/Android will mask corners) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>
  <!-- Camera viewfinder frame corners -->
  <g stroke="#ffffff" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M180 320 L180 240 Q180 200 220 200 L300 200"/>
    <path d="M824 320 L824 240 Q824 200 784 200 L704 200"/>
    <path d="M180 704 L180 784 Q180 824 220 824 L300 824"/>
    <path d="M824 704 L824 784 Q824 824 784 824 L704 824"/>
  </g>
  <!-- Pencil drawing a line -->
  <g transform="translate(512 512) rotate(-25) translate(-90 -260)">
    <!-- pencil body -->
    <path d="M40 60 L140 60 L140 380 L90 460 L40 380 Z" fill="url(#pencil)" stroke="#5a5a70" stroke-width="6" stroke-linejoin="round"/>
    <!-- tip -->
    <path d="M40 380 L90 460 L140 380 Z" fill="#1a1a26"/>
    <!-- eraser -->
    <rect x="40" y="30" width="100" height="45" rx="6" fill="#ff7a45" stroke="#5a5a70" stroke-width="6"/>
    <!-- band -->
    <rect x="40" y="75" width="100" height="18" fill="#ffcc00" stroke="#5a5a70" stroke-width="4"/>
  </g>
  <!-- Drawn wavy line -->
  <path d="M280 720 Q400 640 520 720 T760 720" stroke="#ffffff" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Sparkle -->
  <g fill="#ffffff" opacity="0.95">
    <path d="M780 320 L800 360 L840 380 L800 400 L780 440 L760 400 L720 380 L760 360 Z"/>
  </g>
</svg>
